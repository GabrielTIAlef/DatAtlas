limit_req_zone $binary_remote_addr zone=datatlas_requests:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=datatlas_questions:1m rate=6r/m;
limit_conn_zone $server_name zone=datatlas_connections:1m;
server {
    listen 80;
    server_name datatlas.inteligencia-operacional.duckdns.org;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://datatlas.inteligencia-operacional.duckdns.org$request_uri; }
}
server {
    listen 443 ssl;
    server_name datatlas.inteligencia-operacional.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/datatlas.inteligencia-operacional.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datatlas.inteligencia-operacional.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/datatlas-error.log warn;
    client_max_body_size 5m;
    client_body_timeout 15s;
    limit_req zone=datatlas_requests burst=20 nodelay;
    limit_req_status 429;
    limit_conn datatlas_connections 8;
    limit_conn_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_read_timeout 45s;
    proxy_pass_header X-Request-ID;
    location ~ "^/api/datasets/[a-f0-9]{32}/ask$" {
        limit_req zone=datatlas_questions burst=2 nodelay;
        proxy_pass http://127.0.0.1:8012;
    }
    location / { proxy_pass http://127.0.0.1:8012; }
}
